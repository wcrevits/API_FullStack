<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login en Medewerkers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2 class="mb-4">Login</h2>
<div class="mb-3">
    <label for="email" class="form-label">E-mail</label>
    <input type="email" id="email" class="form-control" placeholder="Voer je e-mail in">
</div>
<div class="mb-3">
    <label for="password" class="form-label">Wachtwoord</label>
    <input type="password" id="password" class="form-control" placeholder="Voer je wachtwoord in">
</div>
<button id="btnSender" class="btn btn-primary">Login</button>

<h2 class="mt-5">Medewerkers</h2>
<table class="table table-striped mt-3">
    <thead>
    <tr>
        <th>Name</th>
        <th>City</th>
        <th>Compagne</th>
    </tr>
    </thead>
    <tbody id="employees"></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="scripts/code.js"></script>
